# Public template. Replace every <PLACEHOLDER> with your own Cloudflare resource IDs
# (wrangler kv namespace create / wrangler d1 create). Rate-limit namespace IDs must be
# unique integers within your account. Secrets go in `wrangler secret put`, never here.

name = "burnercheck-staging"
main = "src/index.js"
compatibility_date = "2024-09-23"
workers_dev = true
preview_urls = false

[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.css", "**/*.txt"]
fallthrough = true

[limits]
cpu_ms = 100

[observability]
enabled = false

[vars]
PUBLIC_LAUNCH = "false"
ANON_CHECKS_PER_MIN = "10"
KEY_CHECKS_PER_MIN = "120"
DAILY_CHECK_POOL = "12000"
DAILY_ANON_CHECK_POOL = "7000"
MCP_REGISTRY_AUTH = ""

[[ratelimits]]
name = "CHECK_LIMITER"
namespace_id = "<RATE_LIMIT_NAMESPACE_ID_1>"

  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]]
name = "KEY_LIMITER"
namespace_id = "<RATE_LIMIT_NAMESPACE_ID_2>"

  [ratelimits.simple]
  limit = 120
  period = 60

[[kv_namespaces]]
binding = "KEYS"
id = "<KV_NAMESPACE_ID>"

[[durable_objects.bindings]]
name = "QUOTA"
class_name = "KeyQuota"

[[migrations]]
tag = "v1-keyquota-sqlite"
new_sqlite_classes = ["KeyQuota"]

[env.production]
name = "burnercheck"
workers_dev = true
preview_urls = false

[env.production.limits]
cpu_ms = 100

[env.production.observability]
enabled = false

[env.production.vars]
PUBLIC_LAUNCH = "true"
ANON_CHECKS_PER_MIN = "10"
KEY_CHECKS_PER_MIN = "120"
DAILY_CHECK_POOL = "12000"
DAILY_ANON_CHECK_POOL = "7000"
MCP_REGISTRY_AUTH = ""

[[env.production.ratelimits]]
name = "CHECK_LIMITER"
namespace_id = "<RATE_LIMIT_NAMESPACE_ID_3>"

  [env.production.ratelimits.simple]
  limit = 10
  period = 60

[[env.production.ratelimits]]
name = "KEY_LIMITER"
namespace_id = "<RATE_LIMIT_NAMESPACE_ID_4>"

  [env.production.ratelimits.simple]
  limit = 120
  period = 60

[[env.production.kv_namespaces]]
binding = "KEYS"
id = "<PRODUCTION_KV_NAMESPACE_ID>"

[[env.production.durable_objects.bindings]]
name = "QUOTA"
class_name = "KeyQuota"

[[env.production.migrations]]
tag = "v1-keyquota-sqlite"
new_sqlite_classes = ["KeyQuota"]
